# The strategy kit: sdk is what a strategy is written against, template is a strategy to start from.
#   rustup target add wasm32-unknown-unknown
#   cargo build --release --target wasm32-unknown-unknown -p template     -> target/wasm32-unknown-unknown/release/template.wasm
[workspace]
resolver = "2"
members = ["sdk", "template"]

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
panic = "abort"
